name: Build Widgetfy APKs

on:
  push:
    branches: [ main, arena/9086af92-moviesstream ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Generate debug keystore (if missing)
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Widgetfy, OU=Widgetfy, O=Widgetfy, L=Ahmedabad, S=Gujarat, C=IN"
          fi
          ls -lh app/*.keystore 2>&1 || echo "no keystore"

      - name: Build Release APKs
        run: |
          gradle assembleRelease --stacktrace --info
          ls -lh app/build/outputs/apk/release/

      - name: List APK outputs
        run: |
          find app/build -name "*.apk" -type f -exec ls -lh {} \;
          echo "---"
          ls -R app/build/outputs/ || true

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          # Gradle splits produce: app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk, app-universal-release.apk
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -lh release-apks/
          # Also ensure universal exists
          for f in release-apks/*.apk; do echo "$f"; done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: widgetfy-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Widgetfy v1.0.0 - Build ${{ github.run_number }}"
          body: |
            ## Widgetfy v1.0.0 — Real Working Widgets

            📦 **Package:** `com.widgetfy.com`
            📱 **12 Premium Widgets** — Clock, Battery, Weather, Calendar, Todo, Photo, Search, Quote, World Clock, Steps etc.

            ### Downloads
            - **universal.apk** → All devices (recommended)
            - **arm64-v8a.apk** → Modern 64-bit phones
            - **armeabi-v7a.apk** → Older 32-bit phones

            ### How to install
            1. Download universal.apk
            2. Enable Install from Unknown Sources
            3. Install & long-press home → Widgets → Widgetfy

            _Built via GitHub Actions with ABI splits_
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build success
        run: echo "✅ APKs built and released successfully!"
