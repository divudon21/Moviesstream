name: Build Widgetfy APKs

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME 2>&1 | head -n 20
          echo "Existing SDK:"
          sdkmanager --list_installed 2>&1 | head -n 40
          echo "Installing required packages..."
          yes | sdkmanager --licenses 2>&1 | tail -n 5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" 2>&1 | tail -n 20
          echo "SDK setup done"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Generate debug keystore (if missing)
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Widgetfy, OU=Widgetfy, O=Widgetfy, L=Ahmedabad, S=Gujarat, C=IN"
          fi
          ls -lh app/*.keystore 2>&1 || echo "no keystore"

      - name: Build Release APKs
        run: |
          set -o pipefail
          gradle clean assembleRelease --stacktrace 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== GRADLE EXIT CODE: $GRADLE_EXIT ==="
          echo "=== BUILD LOG TAIL ==="
          tail -n 300 build.log || true
          echo "=== FIND APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "no APKs found"
          ls -lh app/build/outputs/apk/release/ 2>&1 || echo "no outputs yet"
          # Fail if gradle failed
          if [ "$GRADLE_EXIT" -ne 0 ]; then echo "Gradle failed with $GRADLE_EXIT"; exit $GRADLE_EXIT; fi

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG (last 400 lines) ==="
          tail -n 400 build.log || cat build.log || echo "no log"
          echo "=== ERRORS ==="
          grep -i -E "error|exception|failed" build.log | head -n 100 || true
          echo "=== EMIT ANNOTATIONS ==="
          grep -m 20 -i "e: " build.log | while IFS= read -r line; do echo "::error::$line"; done || true
          grep -m 20 "Unresolved reference" build.log | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: List APK outputs
        if: always()
        run: |
          echo "=== LIST APK OUTPUTS STEP ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "no apk in app/build"
          echo "---"
          ls -R app/build/outputs/ 2>&1 || echo "no outputs folder"
          cat build.log | grep -E "BUILD SUCCESS|BUILD FAILED" | tail || true

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -lh release-apks/
          cd release-apks
          # Create only the 3 requested APKs
          for f in *arm64*.apk; do [ -f "$f" ] && cp "$f" "arm64-v8a.apk" && echo "created arm64-v8a.apk" || true; done
          for f in *v7a*.apk; do [ -f "$f" ] && cp "$f" "armeabi-v7a.apk" && echo "created armeabi-v7a.apk" || true; done
          for f in *universal*.apk; do [ -f "$f" ] && cp "$f" "universal.apk" && echo "created universal.apk" || true; done
          # Remove extra aliases - keep ONLY 3 requested files
          rm -f app-*.apk widgetfy-*.apk 2>/dev/null || true
          echo "=== Final release files (ONLY 3) ==="
          ls -lh
          echo "Count: $(ls -1 *.apk 2>/dev/null | wc -l) files"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: widgetfy-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Widgetfy v3.0.0 Liquid Glass — Build ${{ github.run_number }}"
          body: |
            ## Widgetfy v3.0.0 — Liquid Glass Edition ✨

            📦 **Package:** `com.widgetfy.com` | **26 Real Widgets** | **Liquid Glass + Bento + Material 3 Expressive**
            🎨 **Design:** haider-nawaz/liquid-glass-skill (Apple WWDC25) → Android: translucent gradients + glass borders + aurora blur | Violet #6750A4

            **26 Widgets (all with liquid glass background):** Digital/Analog/Flip/World Clock • Battery Pro • Weather Glass • Search • Steps • Calendar Bento • Tasks • Photo • Daily Zen • Music Player • Countdown • Finance Pulse • Health Ring • News • Crypto Ticker • Habit Streak • Reminder • ★ NEW: Focus Timer • Savings Goal • Breathe • Quick Dial • VPN Control • Screen Time

            ### Downloads (3 APKs ONLY)
            - **universal.apk** → All devices (recommended)
            - **arm64-v8a.apk** → Modern 64-bit phones
            - **armeabi-v7a.apk** → Older 32-bit phones

            ### How to install
            1. Download universal.apk
            2. Enable Install from Unknown Sources
            3. Install & long-press home → Widgets → Widgetfy → Drag any of 26 widgets (liquid glass on every widget!)

            _Built via GitHub Actions with ABI splits — triggered on push to ${{ github.ref_name }} — v3 Liquid Glass Edition_
          files: |
            release-apks/arm64-v8a.apk
            release-apks/armeabi-v7a.apk
            release-apks/universal.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build success
        run: echo "✅ 3 APKs built and released successfully!"
