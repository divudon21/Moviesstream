name: Build Widgetfy APKs

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME 2>&1 | head -n 20
          echo "Existing SDK:"
          sdkmanager --list_installed 2>&1 | head -n 40
          echo "Installing required packages..."
          yes | sdkmanager --licenses 2>&1 | tail -n 5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" 2>&1 | tail -n 20
          echo "SDK setup done"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Generate debug keystore (if missing)
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Widgetfy, OU=Widgetfy, O=Widgetfy, L=Ahmedabad, S=Gujarat, C=IN"
          fi
          ls -lh app/*.keystore 2>&1 || echo "no keystore"

      - name: Build Release APKs
        run: |
          set -o pipefail
          gradle clean assembleRelease --stacktrace 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== GRADLE EXIT CODE: $GRADLE_EXIT ==="
          echo "=== BUILD LOG TAIL ==="
          tail -n 300 build.log || true
          echo "=== FIND APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "no APKs found"
          ls -lh app/build/outputs/apk/release/ 2>&1 || echo "no outputs yet"
          # Fail if gradle failed
          if [ "$GRADLE_EXIT" -ne 0 ]; then echo "Gradle failed with $GRADLE_EXIT"; exit $GRADLE_EXIT; fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: List APK outputs
        run: |
          echo "=== LIST APK OUTPUTS STEP ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "no apk in app/build"
          echo "---"
          ls -R app/build/outputs/ 2>&1 || echo "no outputs folder"
          cat build.log | grep -E "BUILD SUCCESS|BUILD FAILED" | tail || true

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -lh release-apks/
          cd release-apks
          # Normalize to requested names: arm64-v8a.apk, armeabi-v7a.apk, universal.apk
          for f in *arm64*.apk; do [ -f "$f" ] && cp "$f" "arm64-v8a.apk" && echo "created arm64-v8a.apk" || true; done
          for f in *v7a*.apk; do [ -f "$f" ] && cp "$f" "armeabi-v7a.apk" && echo "created armeabi-v7a.apk" || true; done
          for f in *universal*.apk; do [ -f "$f" ] && cp "$f" "universal.apk" && echo "created universal.apk" || true; done
          # Also keep widgetfy prefixed for clarity
          for f in *arm64*.apk; do [ -f "$f" ] && cp "$f" "widgetfy-arm64-v8a.apk" || true; done
          for f in *v7a*.apk; do [ -f "$f" ] && cp "$f" "widgetfy-armeabi-v7a.apk" || true; done
          for f in *universal*.apk; do [ -f "$f" ] && cp "$f" "widgetfy-universal.apk" || true; done
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: widgetfy-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "Widgetfy v2.0.0 Bento — Build ${{ github.run_number }}"
          body: |
            ## Widgetfy v2.0.0 — Premium Bento Edition ✨

            📦 **Package:** `com.widgetfy.com` | **20 Real Widgets** | **Material 3 Expressive + Bento Box Grid**
            🎨 **Design:** ui-ux-pro-max skill v2.15.0 — Violet #6750A4 + Teal + Rose palette

            **20 Widgets:** Digital/Analog/Flip/World Clock • Battery Pro • Weather Glass • Search • Steps • Calendar Bento • Tasks • Photo • Daily Zen • ★ Music Player • Countdown • Finance Pulse • Health Ring • News • Crypto Ticker • Habit Streak • Reminder

            ### Downloads (3 APK splits)
            - **universal.apk** → All devices (recommended)
            - **arm64-v8a.apk** → Modern 64-bit phones
            - **armeabi-v7a.apk** → Older 32-bit phones
            - plus `widgetfy-*` and `app-*` aliases (9 files total)

            ### How to install
            1. Download universal.apk
            2. Enable Install from Unknown Sources
            3. Install & long-press home → Widgets → Widgetfy → Drag any of 20 widgets

            _Built via GitHub Actions with ABI splits — triggered on push to ${{ github.ref_name }} — v2 Bento Edition_
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build success
        run: echo "✅ APKs built and released successfully!"
